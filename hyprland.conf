# Legacy Hyprland counterpart for setups that still consume theme .conf files.
general {
    col.active_border = rgba(9BC4BCee) rgba(C2A0C7ee) rgba(D8BF83ee) 45deg
    col.inactive_border = rgba(817A8966)
    border_size = 2
    gaps_in = 5
    gaps_out = 10
}

decoration {
    rounding = 12
    rounding_power = 3
    active_opacity = 0.91
    inactive_opacity = 0.83
    blur {
        enabled = true
        size = 8
        passes = 3
        noise = 0.02
        contrast = 0.92
        brightness = 0.86
        vibrancy = 0.12
    }
}

